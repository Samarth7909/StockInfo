spring:
  datasource:
    # Each Spring context gets a unique in-memory SQLite database (via random name)
    # to prevent cross-context state leakage between test classes.
    url: jdbc:sqlite:file:ops-console-test?mode=memory&cache=shared&uri=true
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Allow Flyway to clean and re-migrate the in-memory test DB on each context start.
    # Safe because this is an in-memory test-only database.
    clean-disabled: false
    clean-on-validation-error: false

logging:
  level:
    com.indira: DEBUG
    org.flywaydb: WARN
    org.springframework.security: WARN
